spring.application.name=skill_hire
server.port=8080
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/hiring_application}

aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${S3_BUCKET_NAME:}
aws.ses.sender=${SES_SENDER_EMAIL:}

jwt.secret=${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}