apiVersion: app/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: skill-hire
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-hire
      tier: database
  template:
    metadata:
      labels:
        app: skill-hire
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skill-hire-secrets
                  key: db-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skill-hire-secrets
                  key: db-password
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage 
          persistentVolumeClaim:
            claimName: mongodb-pvc