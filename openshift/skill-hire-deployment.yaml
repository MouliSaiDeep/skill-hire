apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-hire-deployment
  labels:
    app: skill-hire
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skill-hire
      tier: backend
  template:
    metadata:
      labels:
        app: skill-hire
        tier: backend
    spec:
      containers:
      - name: skill-hire
        image: moulisaideep/skill-hire:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: jwt-secret
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: mongo-uri
        - name: AWS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: aws-access-key
        - name: AWS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: aws-secret-key
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: s3-bucket-name
        - name: SES_SENDER_EMAIL
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: ses-sender-email
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: admin-email
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skill-hire-secrets
              key: admin-password 